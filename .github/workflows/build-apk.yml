name: 构建 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            cmake libffi-dev libssl-dev

      - name: 安装 Python 依赖项
        run: |
          pip install --upgrade buildozer Cython==0.29.36 python-for-android sh jinja2

      - name: 复制共享模块
        run: |
          cp lkj_viewer/excel_handler.py lkj_viewer/android_version/

      - name: 构建APK
        working-directory: lkj_viewer/android_version
        run: |
          buildozer android debug
          ls -la bin/

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: LKJ数据管理-APK
          path: lkj_viewer/android_version/bin/*.apk
          retention-days: 30
